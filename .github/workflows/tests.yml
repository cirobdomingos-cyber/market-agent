name: tests

# Run on every push to any branch and on every PR targeting main.
# Two jobs run in parallel: backend pytest and frontend vite build.
# Neither job touches real external services — tests mock Anthropic,
# yfinance, and both brokers, and the frontend job only builds, never
# deploys.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketcoach
    env:
      # The Settings class requires ANTHROPIC_API_KEY at import time via
      # pydantic-settings. Every test mocks the Anthropic client, so any
      # non-empty string works here — this key is never sent anywhere.
      ANTHROPIC_API_KEY: test-key-never-used-in-ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: marketcoach/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -q --tb=short

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketcoach/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: marketcoach/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # `vite build` fails on any TypeScript/import error, so this
        # catches broken imports, missing exports, and syntax bugs
        # without needing a separate lint/typecheck step.
        run: npm run build
